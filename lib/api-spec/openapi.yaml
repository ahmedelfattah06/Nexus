components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Workspace:
      type: object
      properties:
        id:
          type: integer
        userId:
          type: string
        name:
          type: string
        icon:
          type: string
        color:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - userId
        - name
        - createdAt
        - updatedAt

    CreateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string
      required:
        - name

    UpdateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
        icon:
          type: string
        color:
          type: string

    Page:
      type: object
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        userId:
          type: string
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - workspaceId
        - userId
        - title
        - content
        - createdAt
        - updatedAt

    CreatePageBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]
      required:
        - title

    UpdatePageBody:
      type: object
      properties:
        title:
          type: string
        content:
          type: string
        tags:
          type: array
          items:
            type: string
        priority:
          type: string
          enum: [high, medium, low]

    Task:
      type: object
      properties:
        id:
          type: integer
        workspaceId:
          type: integer
        userId:
          type: string
        title:
          type: string
        status:
          type: string
          enum: [todo, in_progress, done]
        priority:
          type: string
          enum: [high, medium, low]
        deadline:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
