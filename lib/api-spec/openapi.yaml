    delete:
      operationId: deletePage
      tags: [pages]
      summary: Delete a page
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: integer
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
